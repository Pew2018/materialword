org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Maven Central and the Gradle plugin portal occasionally answer with HTTP 429
# or 5xx under load. These are Gradle's own dependency-download retry knobs
# (`RetrySupport`): retry each artifact up to 6 times with an exponential
# backoff starting at 2s, instead of failing the whole build on a transient
# upstream error. TLS verification and the official repositories stay untouched.
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
