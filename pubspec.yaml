name: materialword
description: "MaterialWord — offline English vocabulary learning (Flutter, Material Design 2 classic theme)."
publish_to: 'none'

# Version is also stored in backups and shown in Settings.
version: 1.2.0+3

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Message formatting for the gen_l10n output (dates, plurals, numbers).
  intl: ^0.20.3

  # State management (small, no codegen).
  flutter_riverpod: ^3.5.0

  # Local database: SQLite via Drift.
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3: ^3.9.2

  # Utilities.
  uuid: ^4.6.0
  path_provider: ^2.1.6
  file_picker: ^13.4.1
  http: ^1.6.0
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8
  xml: ^7.1.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # gen_l10n reads l10n.yaml. The generated code is committed under
  # lib/l10n/generated so a checkout builds without running codegen first, and
  # CI regenerates it to prove the ARB files are the only source of truth.
  generate: true
  assets:
    # Offline dictionary, generated from ECDICT (MIT) by tool/build_dictionary.py.
    - assets/dictionary/ecdict_core.db
    - assets/dictionary/ecdict_core.db.meta.json
    # Tiny demo wordbook used by "载入示例词书".
    - assets/wordbooks/sample_cet6.json
