name: Temporary Dart format repair
on:
  push:
    paths:
      - .github/workflows/webdav-format-repair.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - run: |
          dart format lib/features/sync/webdav_directory_picker.dart lib/services/sync/webdav_sync_provider.dart lib/services/sync/webdav_trace.dart test/phase6_2_1_webdav_real_compat_test.dart
          git rm .github/workflows/webdav-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format WebDAV compatibility changes"
          git push origin HEAD:main
