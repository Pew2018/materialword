name: Refresh goldens

# Temporary, manually triggered helper: regenerates the Linux golden references
# (which can only be produced by the Ubuntu rasteriser) and uploads them as an
# artifact. Delete this file once the references are committed.

on:
  workflow_dispatch:

jobs:
  refresh:
    name: Regenerate Linux golden references
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Code generation (drift)
        run: dart run build_runner build

      - name: Regenerate goldens
        run: flutter test --update-goldens test/phase3_golden_test.dart

      - name: Upload Linux references
        uses: actions/upload-artifact@v7
        with:
          name: linux-goldens
          path: test/goldens/*.linux.png
          retention-days: 7
