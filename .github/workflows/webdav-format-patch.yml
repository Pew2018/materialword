name: WebDAV format patch
on:
  push:
    paths:
      - .github/workflows/webdav-format-patch.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: |
          dart format lib/services/sync/webdav_sync_provider.dart test/phase6_2_1_webdav_real_compat_test.dart
          git diff --check
          git diff --no-ext-diff --binary | gzip -n | base64 -w 0
          echo
