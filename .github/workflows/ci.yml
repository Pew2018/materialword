name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Cancel superseded runs: this is a private repository and macOS minutes are
# billed at a premium, so we never let two builds of the same ref run at once.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with README.md / docs/build-guide.md and the local SDK.
  FLUTTER_VERSION: 3.50.1

jobs:
  validate:
    name: Validate (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Code generation (drift)
        run: dart run build_runner build

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

  android:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get
      - run: dart run build_runner build

      - name: Build release APK (arm64 only)
        run: flutter build apk --release --target-platform android-arm64

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/MaterialWord-${GITHUB_SHA::7}-android-arm64.apk"
          {
            echo "artifact: MaterialWord-${GITHUB_SHA::7}-android-arm64.apk"
            echo "commit: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            echo "flutter: ${FLUTTER_VERSION}"
            echo "signing: debug keystore (temporary; not for production updates)"
          } > dist/build-info-android.txt

      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS .app
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package .app (keeps symlinks and permissions)
        run: |
          mkdir -p dist
          APP="build/macos/Build/Products/Release/MaterialWord.app"
          lipo -info "$APP/Contents/MacOS/MaterialWord" || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "dist/MaterialWord-${GITHUB_SHA::7}-macos.zip"
          {
            echo "artifact: MaterialWord-${GITHUB_SHA::7}-macos.zip"
            echo "commit: $GITHUB_SHA"
            echo "flutter: ${FLUTTER_VERSION}"
            echo "arch: $(lipo -archs "$APP/Contents/MacOS/MaterialWord" 2>/dev/null || echo unknown)"
            echo "signing: ad-hoc / unsigned — not notarised, no Developer ID"
          } > dist/build-info-macos.txt

      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: dist/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned build
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Collect build report
        run: |
          mkdir -p dist
          {
            echo "commit: $GITHUB_SHA"
            echo "flutter: ${FLUTTER_VERSION}"
            echo "result: flutter build ios --release --no-codesign succeeded"
            echo "note: an unsigned build is NOT installable on iPhone/iPad."
            echo "note: a signed IPA requires an Apple Developer team + provisioning profile."
          } > dist/build-info-ios.txt
          if [ -d build/ios/iphoneos/Runner.app ]; then
            ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app \
              "dist/MaterialWord-${GITHUB_SHA::7}-ios-unsigned.zip"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned
          path: dist/
          if-no-files-found: warn
          retention-days: 7
