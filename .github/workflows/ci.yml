name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Cancel superseded runs: this is a private repository and macOS minutes are
# billed at a premium, so we never let two builds of the same ref run at once.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with README.md / docs/build-guide.md and the local SDK.
  FLUTTER_VERSION: 3.50.1

jobs:
  validate:
    name: Validate (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Code generation (drift)
        run: dart run build_runner build

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        id: test
        run: flutter test --reporter expanded

      # Golden references are per host rasteriser (macOS uses CoreText, Linux
      # uses FreeType). When a comparison fails, the master/test/diff images are
      # the evidence needed to decide "real regression" vs "new platform
      # baseline", so always keep them.
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cross-timezone event replay
        run: tool/verify_timezone_replay.sh

  android:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get
      - run: dart run build_runner build

      - name: Build release APK (arm64 only)
        # Gradle retries individual artifact downloads (see android/gradle.properties),
        # but a run can still fail if every attempt hits a 429/5xx window. Retry
        # the whole build with backoff — no version downgrade, no mirror, no
        # disabled TLS verification.
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release --target-platform android-arm64; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "APK build failed after $attempt attempts" >&2
              exit 1
            fi
            echo "::warning::APK build attempt $attempt failed, retrying in $((attempt * 60))s"
            sleep $((attempt * 60))
          done

      - name: Verify APK (ABI, application id, signature)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK" || { echo "APK missing" >&2; exit 1; }
          unzip -l "$APK" > apk-contents.txt
          grep -q 'lib/arm64-v8a/libflutter.so' apk-contents.txt \
            || { echo "APK has no arm64 engine" >&2; exit 1; }
          if grep -q 'lib/armeabi-v7a/' apk-contents.txt; then
            echo "APK unexpectedly contains 32-bit libraries" >&2
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -3
          "$BUILD_TOOLS/aapt" dump badging "$APK" \
            | grep -q "package: name='com.pew2018.materialword'" \
            || { echo "unexpected application id" >&2; exit 1; }
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/MaterialWord-${GITHUB_SHA::7}-android-arm64.apk"
          {
            echo "artifact: MaterialWord-${GITHUB_SHA::7}-android-arm64.apk"
            echo "commit: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            echo "flutter: ${FLUTTER_VERSION}"
            echo "signing: debug keystore (temporary; not for production updates)"
          } > dist/build-info-android.txt

      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS .app
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      - name: Toolchain report
        run: |
          mkdir -p dist
          {
            echo "commit: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            flutter --version | head -2
            xcodebuild -version 2>/dev/null | head -2 || echo "xcode: $(xcode-select -p)"
            echo "host: $(sw_vers -productVersion) $(uname -m)"
          } > dist/build-info-macos.txt

      - name: Build macOS release
        run: flutter build macos --release

      # The build succeeding proves nothing about the bundle starting. These two
      # steps are the regression gate for the Phase 2 launch failure: a
      # restricted entitlement (`keychain-access-groups`) with no provisioning
      # profile made launchd refuse to spawn the app.
      - name: Verify bundle (structure, signature, entitlements)
        env:
          APP: build/macos/Build/Products/Release/MaterialWord.app
        run: |
          tool/verify_macos_bundle.sh --app "$APP" --expect-arch universal \
            --report dist/build-info-macos.txt | tee dist/verify-bundle.txt

      - name: Package .app (ditto keeps symlinks and permissions)
        run: |
          APP="build/macos/Build/Products/Release/MaterialWord.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "dist/MaterialWord-${GITHUB_SHA::7}-macos.zip"

      # A user unzips with Archive Utility, which is ditto. Re-extract the
      # artifact we are about to publish and check it all over again.
      - name: Verify ZIP round trip
        run: |
          tool/verify_macos_bundle.sh \
            --zip "dist/MaterialWord-${GITHUB_SHA::7}-macos.zip" \
            --expect-arch universal | tee dist/verify-zip.txt

      # MAC02/MAC03 live in the test suite but need a real bundle and zip, so
      # they run here rather than in the Ubuntu validate job.
      - name: macOS packaging regressions (MAC02 / MAC03)
        run: flutter test test/macos_packaging_test.dart --reporter expanded

      # The real acceptance test: start the app the way Finder does and require
      # it to stay up and reach its first screen. A skipped run is reported as
      # skipped — never as passed.
      - name: Real launch verification
        id: launch
        continue-on-error: true
        env:
          APP: build/macos/Build/Products/Release/MaterialWord.app
        run: |
          tool/verify_macos_bundle.sh --app "$APP" --expect-arch universal \
            --launch --launch-timeout 20 2>&1 | tee dist/verify-launch.txt

      - name: Classify launch result
        run: |
          if grep -q 'RESULT: PASS' dist/verify-launch.txt; then
            status="executed-pass"
          elif grep -q 'no GUI session' dist/verify-launch.txt; then
            # GitHub's macOS runners may have no usable WindowServer session.
            # Record the limitation instead of pretending the test ran.
            status="not-executed-no-gui-session"
          else
            echo "Launch verification failed:"
            cat dist/verify-launch.txt
            exit 1
          fi
          echo "LAUNCH_STATUS=$status" >> "$GITHUB_ENV"
          {
            echo "launch-verification: $status"
            echo "--- verify-launch.txt ---"
            cat dist/verify-launch.txt
          } >> dist/build-info-macos.txt

      - name: Finalise build info
        run: |
          APP="build/macos/Build/Products/Release/MaterialWord.app"
          EXE="$APP/Contents/MacOS/MaterialWord"
          {
            echo "artifact: MaterialWord-${GITHUB_SHA::7}-macos.zip"
            echo "arch: $(lipo -archs "$EXE" 2>/dev/null || echo unknown)"
            echo "min-macos: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist" 2>/dev/null || echo unknown)"
            echo "bundle-id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")"
            echo "signing: $(codesign -dv "$APP" 2>&1 | awk -F= '/^Signature/{print $2}') (no Developer ID, no provisioning profile)"
            echo "notarised: no (ad-hoc signature; Gatekeeper asks the user to allow the first launch)"
            echo "launch-verification: ${LAUNCH_STATUS:-unknown}"
          } >> dist/build-info-macos.txt

      - name: Show build info
        run: cat dist/build-info-macos.txt

      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: dist/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned build
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Collect build report
        run: |
          mkdir -p dist
          {
            echo "commit: $GITHUB_SHA"
            echo "flutter: ${FLUTTER_VERSION}"
            echo "result: flutter build ios --release --no-codesign succeeded"
            echo "note: an unsigned build is NOT installable on iPhone/iPad."
            echo "note: a signed IPA requires an Apple Developer team + provisioning profile."
          } > dist/build-info-ios.txt
          if [ -d build/ios/iphoneos/Runner.app ]; then
            ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app \
              "dist/MaterialWord-${GITHUB_SHA::7}-ios-unsigned.zip"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned
          path: dist/
          if-no-files-found: warn
          retention-days: 7
